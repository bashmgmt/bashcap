[package]
name = "bashcap"
version = "0.1.0"
edition = "2024"
description = "A transparent bash wrapper that writes the full state of a running shell at every BASHCAP call site, as one JSON object per line."
readme = "README.md"
repository = "https://github.com/simlei/bashcap"
keywords = ["bash", "shell", "debugging", "snapshot", "tracing"]
categories = ["development-tools::debugging", "command-line-utilities"]
exclude = [".plans/**"]

[dependencies]
bash-interop = "*"
bash-strings = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.53", features = ["rt", "macros"] }
